<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gwent Companion</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="hero-panel glass-panel">
      <div>
        <p class="eyebrow">Compagnon</p>
        <h1>⚔️ Gwent Companion</h1>
      </div>
      <div class="hero-note">Interface premium inspirée de Gwent, optimisée pour mobile.</div>
    </header>

    <section class="weather-panel glass-panel">
      <div class="panel-title">
        <span>Effets météo</span>
      </div>
      <div class="weather-buttons">
        <button
          v-for="w in weatherButtons"
          :key="w.id"
          :title="w.name"
          :class="['weather-btn', {active: weather[w.id]}]"
          @click="toggleWeather(w.id)">
          {{w.icon}}
        </button>
        <button
          class="weather-btn weather-clear"
          title="Beau temps"
          @click="clearWeather">
          ☀️
        </button>
      </div>
    </section>

    <section class="addGlobal glass-panel">
      <div class="section-title">Ajouter une carte</div>

      <div class="button-grid players">
        <button :class="{selected:newCard.player===1}" @click="newCard.player=1">Joueur 1</button>
        <button :class="{selected:newCard.player===2}" @click="newCard.player=2">Joueur 2</button>
      </div>

      <div class="button-grid rows">
        <button :class="{selected:newCard.row==='melee'}" @click="newCard.row='melee'">⚔️</button>
        <button :class="{selected:newCard.row==='range'}" @click="newCard.row='range'">🏹</button>
        <button :class="{selected:newCard.row==='siege'}" @click="newCard.row='siege'">🏰</button>
      </div>

      <div class="button-grid types">
        <button :class="{selected:newCard.type==='normal'}" @click="newCard.type='normal'">Normale</button>
        <button :class="{selected:newCard.type==='hero'}" @click="newCard.type='hero'">⭐</button>
        <button :class="{selected:newCard.type==='morale'}" @click="newCard.type='morale'">💪</button>
        <button :class="{selected:newCard.type==='bond'}" @click="newCard.type='bond'">🤝</button>
        <button :class="{selected:newCard.type==='jaskier'}" @click="newCard.type='jaskier'">🎭</button>
      </div>

      <div class="power-panel">
        <span>Puissance</span>
        <div class="power-controls">
          <button @click="newCard.value = Math.max(1, newCard.value - 1)">-</button>
          <input
            class="power-input"
            type="number"
            min="1"
            v-model.number="newCard.value"
          >
          <button @click="newCard.value = newCard.value + 1">+</button>
        </div>
      </div>

      <button class="add-button" @click="addCard">AJOUTER</button>
    </section>

    <section class="battlefield">
      <div class="player-board glass-panel" v-for="p in players" :key="p.id">
        <div class="player-header">
          <div class="player-label">Joueur {{p.id}}</div>
          <div class="player-score">{{playerTotal(p)}}</div>
        </div>

        <div class="row-panel" v-for="r in rowsForPlayer(p)" :key="r.id">
          <div :class="['row-line', p.id===1 ? 'player-left' : 'player-right', { 'weather-active-row': isWeatherActiveRow(r.id) }]">
            <div class="line-cell line-horn">
              <label class="horn-toggle">
                <input type="checkbox" v-model="p[r.id].horn">
                <span>📯</span>
              </label>
            </div>

            <div class="line-cell line-icon">
              <span class="row-icon">{{r.icon}}</span>
            </div>

            <div class="line-cell line-cards">
              <div class="cards" :ref="el => setCardRowRef(el, p.id, r.id)">
                <div
                  class="card"
                  v-for="(item, i) in displayedCards(p, r.id)"
                  :key="item.index"
                  :style="cardPosition(i, displayedCards(p, r.id).length, p, r.id)"
                  @click="removeCard(p, r.id, item.index)">
                  <div class="card-icon">{{icon(item.card)}}</div>
                  <div class="card-value">{{effective(item.card, p, r.id)}}</div>
                </div>
              </div>
            </div>

            <div class="line-cell line-score">
              <span class="score-value">{{rowTotal(p, r.id)}}</span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div class="reset-area">
      <button class="reset-btn" @click="resetGame">Reset</button>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
