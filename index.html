<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gwent Companion</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
</head>
<body>
  <div id="app" class="app-shell">
    <header class="hero-panel glass-panel hero-center">
      <div>
        <h1>⚔️ Gwent Companion</h1>
      </div>
    </header>

    <div class="header-actions">
      <button class="label-edit-btn" @click="openLabelModal">
        <span class="icon">📜</span>
        <span>Personnaliser la partie</span>
      </button>
      <div class="music-selector">

    <!-- Choix de la musique -->
    <button class="label-edit-btn" @click="toggleMusicMenu">
        <span class="icon">🎵</span>
        <span>{{ currentMusicName }}</span>
    </button>

    <!-- Play / Pause -->
    <button
    class="label-edit-btn music-play-btn"
    @click="toggleMusic"
>
    <span class="icon">
        {{ isMusicPlaying ? '⏸️' : '▶️' }}
    </span>
</button>

    <!-- Menu déroulant -->
    <div v-if="showMusicMenu" class="music-menu">
        <button @click="selectMusic('mandragora')">
            🌿 Mandragora
        </button>

        <button @click="selectMusic('bilgewater')">
            🌊 Bilgewater
        </button>
    </div>

</div>
    </div>

    <section class="coin-panel glass-panel">
      <div class="coin-area">
        <button class="coin-token" :class="[{flip:isFlipping}, coinButtonFactionClass()]" @click="flipPlayerToken" :disabled="isFlipping">
          <span>
            {{ isFlipping ? '...' : (coinResult ? playerNames[coinResult-1] : 'Tirer') }}
          </span>
        </button>
        <div class="coin-hint">Touchez pour tirer le joueur</div>
      </div>
    </section>

    <section class="faction-panel glass-panel">
      <div class="faction-buttons">
        <button
          v-for="(selectedIndex, slot) in factionSelections"
          :key="slot"
          class="faction-token"
          :class="factions[selectedIndex].id"
          @click="cycleFaction(slot)">
          <span class="faction-token-name">{{ factions[selectedIndex].name }}</span>
          <span class="faction-token-slot">{{ playerNames[slot] }}</span>
        </button>
      </div>
    </section>

    <section class="addGlobal glass-panel">
      <div class="section-title">Ajouter une carte</div>

      <div class="button-grid players">
        <button :class="{selected:newCard.player===1}" @click="newCard.player=1">{{playerNames[0]}}</button>
        <button :class="{selected:newCard.player===2}" @click="newCard.player=2">{{playerNames[1]}}</button>
      </div>

      <div class="button-grid rows">
        <button :class="{selected:newCard.row==='melee'}" @click="newCard.row='melee'">⚔️</button>
        <button :class="{selected:newCard.row==='range'}" @click="newCard.row='range'">🏹</button>
        <button :class="{selected:newCard.row==='siege'}" @click="newCard.row='siege'">🏰</button>
      </div>

      <div class="button-grid types">
        <button :class="{selected:newCard.type==='normal'}" @click="selectNewCardType('normal')">👤</button>
        <button :class="{selected:newCard.type==='hero'}" @click="selectNewCardType('hero')">⭐</button>
        <button :class="{selected:newCard.type==='morale'}" @click="selectNewCardType('morale')">💪</button>
        <button :class="{selected:newCard.type==='bond'}" @click="selectNewCardType('bond')">🤝</button>
        <button :class="{selected:newCard.type==='jaskier'}" @click="selectNewCardType('jaskier')">🎭</button>
        <button :class="{selected:newCard.type==='vache'}" @click="selectNewCardType('vache'); newCard.value = 0">🐄</button>
        <button :class="{selected:newCard.type==='villentretenmerth'}" @click="selectNewCardType('villentretenmerth')">💥</button>
      </div>

      <div v-if="newCard.type==='hero'" class="button-grid hero-bonus-grid">
        <button :class="{selected:newCard.heroBonus==='none'}" @click="selectHeroBonus('none')">👤</button>
        <button :class="{selected:newCard.heroBonus==='morale'}" @click="selectHeroBonus('morale')">💪</button>
      </div>

      <div class="power-label">Puissance</div>

      <div class="button-grid presets">
        <button
          v-for="power in powerPresets"
          :key="power"
          :class="{selected:newCard.value===power}"
          @click="newCard.value = power">
          {{power}}
        </button>
      </div>

      <div class="power-panel centered">
        <div class="power-controls">
          <button @click="newCard.value = Math.max(1, newCard.value - 1)">-</button>
          <input
            class="power-input"
            type="number"
            min="0"
            v-model.number="newCard.value"
          >
          <button @click="newCard.value = newCard.value + 1">+</button>
        </div>
      </div>

      <button class="add-button" @click="addCard">AJOUTER</button>
    </section>

    <section class="battlefield">
      <div :class="['player-board','glass-panel', factionClass(p.id)]" v-for="p in players" :key="p.id">
        <div class="player-header">
          <div class="player-label">{{playerNames[p.id - 1]}}</div>
          <div :class="['player-score', factionScoreClass(p.id)]">{{playerTotal(p)}}</div>
        </div>

        <div class="row-panel" v-for="r in rowsForPlayer(p)" :key="r.id">
          <div :class="['row-line', p.id===1 ? 'player-left' : 'player-right', weatherRowClass(r.id), { 'weather-active-row': isWeatherActiveRow(r.id), 'skellige-row': isSkelligeFaction(p.id), 'skellige-aura': isSkelligeFaction(p.id) && p[r.id].mushroom }]">
            <div class="line-cell line-horn">
              <label class="horn-toggle">
                <input type="checkbox" v-model="p[r.id].horn">
                <span :class="{active: p[r.id].horn}">📯</span>
              </label>
            </div>

            <div v-if="isSkelligeFaction(p.id)" class="line-cell line-mushroom">
              <label class="mushroom-toggle">
                <input type="checkbox" v-model="p[r.id].mushroom">
                <span :class="{active: p[r.id].mushroom}">🍄</span>
              </label>
            </div>

            <div class="line-cell line-icon">
              <span class="row-icon">{{r.icon}}</span>
            </div>

            <div class="line-cell line-cards">
              <div class="cards" :ref="el => setCardRowRef(el, p.id, r.id)">
                <div
                  class="card"
                  :class="[
                    factionCardClass(p.id),
                    weatherCardClass(r.id),
                    { 'max-value-card': isMaxValueCard(p, r.id, item.index), 'burning-card': isBurningCard(p, r.id, item.index) }
                  ]"
                  v-for="(item, i) in displayedCards(p, r.id)"
                  :key="item.index"
                  :style="cardPosition(i, displayedCards(p, r.id).length, p, r.id)"
                  @click="removeCard(p, r.id, item.index)">
                  <div class="card-icon">
                    <span v-for="(iconSymbol, idx) in cardIcons(item.card)" :key="`${item.index}-${idx}`" class="card-icon-symbol">{{iconSymbol}}</span>
                  </div>
                  <div class="card-value">{{effective(item.card, p, r.id)}}</div>
                </div>
              </div>
            </div>

            <div class="line-cell line-score">
              <span :class="['score-value', factionScoreClass(p.id)]">{{rowTotal(p, r.id)}}</span>
            </div>
          </div>
        </div>

        <!-- player action buttons moved below the battlefield to keep boards visually framed -->
      </div>
    </section>

    <section class="weather-panel glass-panel">
      <div class="weather-line">
        <div class="weather-left">
          <div class="weather-buttons">
            <button
              v-for="w in weatherButtons"
              :key="w.id"
              :title="w.name"
              :class="['weather-btn', {active: weather[w.id]}]"
              @click="toggleWeather(w.id)">
              {{w.icon}}
            </button>
            <button
              class="weather-btn weather-clear"
              title="Beau temps"
              @click="clearWeather">
              ☀️
            </button>
          </div>
        </div>

        <button
          class="highlight-max-btn"
          :class="{active:maxValueActive}"
          @click="highlightMaxValueCards">
          ☠️
        </button>
      </div>
    </section>

    <div class="controls-row">
      <div class="controls-left">
        <button
          v-if="isMonsterFaction(1)"
          class="monster-random-btn"
          :disabled="!hasMonsterUnitCandidates(1)"
          @click="resetToRandomMonsterCard(1)">
          Garder une unité aléatoire
        </button>
      </div>

      <div class="controls-center">
        <button class="reset-btn" @click="resetGame">nouvelle manche</button>
      </div>

      <div class="controls-right">
        <button
          v-if="isMonsterFaction(2)"
          class="monster-random-btn"
          :disabled="!hasMonsterUnitCandidates(2)"
          @click="resetToRandomMonsterCard(2)">
          Garder une unité aléatoire
        </button>
      </div>
    </div>

    <div class="modal-overlay" v-if="showLabelModal" @click.self="closeLabelModal">
      <div class="label-modal" @click.stop>
        <div class="modal-title">
          <span class="icon">📜</span>
          <span>Personnaliser la partie</span>
        </div>
        <div class="modal-body">
          <div class="modal-field">
            <label for="player1-name">Nom du Joueur 1</label>
            <input id="player1-name" type="text" v-model="labelModal.player1" maxlength="20" />
          </div>
          <div class="modal-field">
            <label for="player2-name">Nom du Joueur 2</label>
            <input id="player2-name" type="text" v-model="labelModal.player2" maxlength="20" />
          </div>
        </div>
        <div class="modal-actions">
          <button class="modal-btn cancel" @click="closeLabelModal">Annuler</button>
          <button class="modal-btn save" @click="saveLabelModal">Valider</button>
        </div>
      </div>
    </div>
  </div>
  <audio
    id="bgMusic"
    preload="auto"
    >
    <source src="audio/mandragora.mp3" type="audio/mpeg">
  </audio>
  <script src="app.js"></script>
</body>
</html>
